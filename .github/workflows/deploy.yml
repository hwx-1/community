name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: server/go.sum
      - name: Test backend
        run: go -C server test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure and verify SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2; exit}')"
          if [ "$actual_fingerprint" != "$SSH_FINGERPRINT" ]; then
            echo "SSH host fingerprint mismatch"
            exit 1
          fi

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'sh -se' <<'REMOTE'
          cd /opt/xsnbb
          git pull --ff-only origin main
          cd infra
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          for i in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:8080/api/v1/capabilities >/dev/null; then
              break
            fi
            if [ "$i" -eq 24 ]; then
              docker compose -f docker-compose.prod.yml logs --tail=200 xsnbb
              exit 1
            fi
            sleep 5
          done
          docker image prune -f
          echo "Deployed at $(date)"
          REMOTE
