# 本地开发环境：PostgreSQL + Redis
# 生产部署文件另行提供（境外服务器自托管）
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xsnbb
      POSTGRES_PASSWORD: xsnbb
      POSTGRES_DB: xsnbb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
