# 沈阳大学校园社区 - 生产部署 Docker Compose
services:
  xsnbb:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: xsnbb
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - xsnbb-uploads:/data/uploads
      - xsnbb-data:/data
    environment:
      - APP_ENV=prod
      - HTTP_ADDR=:8080
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - SUPER_ADMIN_USER=${SUPER_ADMIN_USER:?SUPER_ADMIN_USER is required}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
      - INVITE_CODE=${INVITE_CODE:?INVITE_CODE is required}
      - WEB_ORIGIN=https://${DOMAIN:?DOMAIN is required}
      - ADMIN_ORIGIN=https://${DOMAIN:?DOMAIN is required}
      - DATABASE_URL=postgres://xsnbb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/xsnbb?sslmode=disable
      - REDIS_ADDR=${REDIS_ADDR:-}
      - SMS_ACCESS_KEY=${SMS_ACCESS_KEY:-}
      - SMS_SECRET=${SMS_SECRET:-}
      - SMS_SIGN_NAME=${SMS_SIGN_NAME:-}
      - SMS_TEMPLATE=${SMS_TEMPLATE:-}
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-}
      - OSS_SECRET=${OSS_SECRET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_PUBLIC_BASE=${OSS_PUBLIC_BASE:-}
      - SEARCH_BASE_URL=${SEARCH_BASE_URL:-}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - BANNED_WORDS=${BANNED_WORDS:-代考,枪手,赌博,诈骗}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/capabilities"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:17-alpine
    container_name: xsnbb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: xsnbb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: xsnbb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xsnbb -d xsnbb"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s

volumes:
  xsnbb-uploads:
  xsnbb-data:
  pgdata:
