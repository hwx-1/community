# 沈阳大学校园社区 - 生产部署 Docker Compose
# 用法：docker compose -f docker-compose.prod.yml up -d

services:
  xsnbb:
    build:
      context: ../..           # 仓库根目录
      dockerfile: infra/Dockerfile
    container_name: xsnbb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # 仅本地回环暴露，Nginx 反代
    volumes:
      - xsnbb-uploads:/data/uploads
      - xsnbb-data:/data      # 后续切 PostgreSQL 时数据卷
    environment:
      # 核心安全（上线前必须改成强随机值）
      - APP_ENV=prod
      - HTTP_ADDR=:8080
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET 未设置}
      - SUPER_ADMIN_USER=${SUPER_ADMIN_USER:-admin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD 未设置}
      - INVITE_CODE=${INVITE_CODE:-xsnbb-test}

      # 跨域 origins（HTTPS 同源部署下实际不触发跨域，保持配置一致）
      - WEB_ORIGIN=https://${DOMAIN:?DOMAIN 未设置}
      - ADMIN_ORIGIN=https://${DOMAIN}

      # 数据库（当前版本未接入，预留配置）
      - DATABASE_URL=${DATABASE_URL:-}
      - REDIS_ADDR=${REDIS_ADDR:-}

      # 阿里云短信（留空则降级开发模式）
      - SMS_ACCESS_KEY=${SMS_ACCESS_KEY:-}
      - SMS_SECRET=${SMS_SECRET:-}
      - SMS_SIGN_NAME=${SMS_SIGN_NAME:-}
      - SMS_TEMPLATE=${SMS_TEMPLATE:-}

      # 阿里云 OSS（留空则降级本地存储）
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-}
      - OSS_SECRET=${OSS_SECRET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET=${OSS_BUCKET:-}

      # 联网检索（留空则回答"未配置"）
      - SEARCH_BASE_URL=${SEARCH_BASE_URL:-}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}

      # 开发模式内容审核违禁词（生产接入真实审核服务后移除）
      - BANNED_WORDS=${BANNED_WORDS:-代考,枪手,赌博,诈骗}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/capabilities"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  xsnbb-uploads:
  xsnbb-data:
