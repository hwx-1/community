# xsnbb 生产部署 Nginx 配置
# 放置路径：/etc/nginx/sites-available/xsnbb
# 然后 ln -s /etc/nginx/sites-available/xsnbb /etc/nginx/sites-enabled/xsnbb

# HTTP：强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name xsnbb.xyz www.xsnbb.xyz;

    # Certbot 验证用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：主服务
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xsnbb.xyz www.xsnbb.xyz;

    # SSL 证书路径（Certbot 会自动填充）
    ssl_certificate /etc/letsencrypt/live/xsnbb.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xsnbb.xyz/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传文件大小限制（单图 ≤10MB，留一点余量）
    client_max_body_size 12m;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态文件缓存（前端构建产物）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 主代理：所有请求转发给 Go 后端
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（预留）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
